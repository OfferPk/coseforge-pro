<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="100%" stop-color="#0b1426"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg-grad)"/>

  <!-- Window Header / Frame -->
  <rect x="40" y="30" width="1120" height="640" rx="12" fill="#0b1426" stroke="#1a2d52" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Window Controls -->
  <circle cx="70" cy="55" r="6" fill="#ff5f56"/>
  <circle cx="90" cy="55" r="6" fill="#ffbd2e"/>
  <circle cx="110" cy="55" r="6" fill="#27c93f"/>
  <text x="140" y="60" fill="#8d9fb8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">COSEForge Pro — IETF RFC 9052 &amp; RFC 9053 Developer Studio</text>

  <!-- Top App Navigation / Badges -->
  <line x1="40" y1="80" x2="1160" y2="80" stroke="#1a2d52" stroke-width="1"/>
  
  <!-- Logo & Title -->
  <rect x="70" y="100" width="70" height="34" rx="6" fill="url(#accent-grad)"/>
  <text x="78" y="123" fill="#000" font-family="monospace" font-size="14" font-weight="800">COSE</text>
  <text x="155" y="118" fill="#f0f4fc" font-family="sans-serif" font-size="18" font-weight="700">COSEForge Pro</text>
  <text x="155" y="134" fill="#8d9fb8" font-family="sans-serif" font-size="12">IETF RFC 9052 CBOR Object Signing &amp; Encryption Studio &amp; FIDO2 Passkey Synthesizer</text>

  <!-- Tags -->
  <rect x="880" y="104" width="110" height="24" rx="4" fill="rgba(0, 229, 255, 0.15)" stroke="#00e5ff" stroke-width="1"/>
  <text x="892" y="120" fill="#00e5ff" font-family="sans-serif" font-size="11" font-weight="600">IETF RFC 9052</text>
  
  <rect x="1000" y="104" width="110" height="24" rx="4" fill="rgba(0, 230, 118, 0.15)" stroke="#00e676" stroke-width="1"/>
  <text x="1012" y="120" fill="#00e676" font-family="sans-serif" font-size="11" font-weight="600">10/10 PASS</text>

  <!-- Metrics Grid -->
  <rect x="70" y="155" width="150" height="50" rx="6" fill="#111e38" stroke="#1a2d52"/>
  <text x="85" y="172" fill="#8d9fb8" font-family="sans-serif" font-size="10" font-weight="700">TOTAL WIRE SIZE</text>
  <text x="85" y="194" fill="#00e5ff" font-family="sans-serif" font-size="16" font-weight="800">114 Bytes</text>

  <rect x="235" y="155" width="150" height="50" rx="6" fill="#111e38" stroke="#1a2d52"/>
  <text x="250" y="172" fill="#8d9fb8" font-family="sans-serif" font-size="10" font-weight="700">CBOR TAG NUMBER</text>
  <text x="250" y="194" fill="#c084fc" font-family="sans-serif" font-size="16" font-weight="800">Tag 18 (Sign1)</text>

  <rect x="400" y="155" width="150" height="50" rx="6" fill="#111e38" stroke="#1a2d52"/>
  <text x="415" y="172" fill="#8d9fb8" font-family="sans-serif" font-size="10" font-weight="700">SECURITY STATUS</text>
  <text x="415" y="194" fill="#00e676" font-family="sans-serif" font-size="16" font-weight="800">VERIFIED (100%)</text>

  <!-- Main Left Card: Parameters -->
  <rect x="70" y="220" width="500" height="420" rx="8" fill="#111e38" stroke="#1a2d52" stroke-width="1"/>
  <text x="90" y="248" fill="#f0f4fc" font-family="sans-serif" font-size="14" font-weight="700">COSE Envelope Parameters</text>

  <text x="90" y="280" fill="#8d9fb8" font-family="sans-serif" font-size="11" font-weight="600">CRYPTOGRAPHIC ALGORITHM</text>
  <rect x="90" y="290" width="460" height="34" rx="4" fill="#080f1e" stroke="#1a2d52"/>
  <text x="102" y="312" fill="#00e5ff" font-family="monospace" font-size="12">ES256 (-7 / ECDSA P-256 + SHA-256)</text>

  <text x="90" y="345" fill="#8d9fb8" font-family="sans-serif" font-size="11" font-weight="600">KEY IDENTIFIER (KID)</text>
  <rect x="90" y="355" width="460" height="34" rx="4" fill="#080f1e" stroke="#1a2d52"/>
  <text x="102" y="377" fill="#f0f4fc" font-family="monospace" font-size="12">passkey-hardware-token-01</text>

  <text x="90" y="410" fill="#8d9fb8" font-family="sans-serif" font-size="11" font-weight="600">APPLICATION PAYLOAD (JSON / CBOR)</text>
  <rect x="90" y="420" width="460" height="50" rx="4" fill="#080f1e" stroke="#1a2d52"/>
  <text x="102" y="442" fill="#f0f4fc" font-family="monospace" font-size="11">{"rpid": "security.company.com", "challenge": "k83hF103..."}</text>

  <text x="90" y="490" fill="#8d9fb8" font-family="sans-serif" font-size="11" font-weight="600">EXTERNAL AAD (ADDITIONAL AUTHENTICATED DATA)</text>
  <rect x="90" y="500" width="460" height="34" rx="4" fill="#080f1e" stroke="#1a2d52"/>
  <text x="102" y="522" fill="#c084fc" font-family="monospace" font-size="11">clientDataHash:e3b0c44298fc1c149afbf4c8...</text>

  <rect x="90" y="555" width="220" height="36" rx="6" fill="#00e5ff"/>
  <text x="110" y="578" fill="#000" font-family="sans-serif" font-size="12" font-weight="700">Synthesize Envelope</text>

  <!-- Main Right Card: Dissected Structure & Hex Viewer -->
  <rect x="590" y="220" width="530" height="420" rx="8" fill="#03060c" stroke="#1a2d52" stroke-width="1"/>
  <text x="610" y="248" fill="#8d9fb8" font-family="sans-serif" font-size="12" font-weight="600">CANONICAL COSE_SIGN1 STRUCTURE &amp; CBOR HEX</text>
  <line x1="590" y1="260" x2="1120" y2="260" stroke="#1a2d52" stroke-width="1"/>

  <g font-family="monospace" font-size="11" fill="#9cdcfe">
    <text x="610" y="285">{</text>
    <text x="630" y="305"><tspan fill="#4ec9b0">"type"</tspan>: <tspan fill="#ce9178">"COSE_Sign1"</tspan>,</text>
    <text x="630" y="325"><tspan fill="#4ec9b0">"tag"</tspan>: <tspan fill="#b5cea8">18</tspan>,</text>
    <text x="630" y="345"><tspan fill="#4ec9b0">"algorithm"</tspan>: <tspan fill="#ce9178">"ES256"</tspan>,</text>
    <text x="630" y="365"><tspan fill="#4ec9b0">"kid"</tspan>: <tspan fill="#ce9178">"passkey-hardware-token-01"</tspan>,</text>
    <text x="630" y="385"><tspan fill="#4ec9b0">"toBeSignedHex"</tspan>: <tspan fill="#ce9178">"846a5369676e617475726531..."</tspan>,</text>
    <text x="630" y="405"><tspan fill="#4ec9b0">"signatureHex"</tspan>: <tspan fill="#ce9178">"8d960de379aa494704e96e84..."</tspan>,</text>
    <text x="630" y="425"><tspan fill="#4ec9b0">"byteLength"</tspan>: <tspan fill="#b5cea8">114</tspan></text>
    <text x="610" y="445">}</text>
  </g>

  <!-- Live Audit Badge -->
  <rect x="610" y="535" width="490" height="34" rx="4" fill="rgba(0, 230, 118, 0.1)" stroke="#00e676" stroke-width="1"/>
  <text x="625" y="557" fill="#00e676" font-family="sans-serif" font-size="12" font-weight="700">✓ IETF RFC 9052 &amp; RFC 9053 Audit: 10/10 PASS (100% Compliant)</text>
</svg>
